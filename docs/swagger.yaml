basePath: /
definitions:
  models.TreeNode:
    properties:
      children:
        items:
          $ref: '#/definitions/models.TreeNode'
        type: array
      created_at:
        type: string
      extra_data:
        additionalProperties: true
        type: object
      id:
        type: string
      name:
        type: string
      node_type:
        type: string
      parent_id:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for Excel upload hierarchy
  title: Hierarchy API
  version: "1.0"
paths:
  /api/v1/hierarchy:
    get:
      description: Fetch all hierarchy nodes
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.TreeNode'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all hierarchy data
      tags:
      - hierarchy
    post:
      consumes:
      - application/json
      description: Create a new hierarchy node manually
      parameters:
      - description: Node data
        in: body
        name: node
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.TreeNode'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a single hierarchy node
      tags:
      - hierarchy
  /api/v1/hierarchy/{id}:
    get:
      description: Fetch a specific hierarchy node and its details
      parameters:
      - description: Node ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.TreeNode'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get hierarchy node by ID
      tags:
      - hierarchy
  /api/v1/hierarchy/{id}/subtree:
    get:
      description: Fetch partial hierarchy (subtree) starting from a specific node
      parameters:
      - description: Node ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.TreeNode'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get subtree for a node
      tags:
      - hierarchy
  /api/v1/hierarchy/full:
    get:
      description: Fetch complete hierarchy in tree structure
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.TreeNode'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get full hierarchy
      tags:
      - hierarchy
  /api/v1/hierarchy/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload hierarchy Excel file and store in DB
      parameters:
      - description: Excel File
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Upload Excel file
      tags:
      - hierarchy
swagger: "2.0"
